<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Quest · Fun Quiz Game</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#1a1446;--bg2:#3b1d7a;--card:#ffffff18;--tx:#fff;--mu:#c9c3ee;--pr:#ffd23f;--ok:#2ee59d;--no:#ff5c7a;--bd:#ffffff30}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#5b3df5;--bg2:#b44cf0}}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}*{box-sizing:border-box}
body{margin:0;min-height:100%;background:linear-gradient(160deg,var(--bg),var(--bg2));background-attachment:fixed;color:var(--tx);font-family:"Trebuchet MS",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.45}
.w{max-width:680px;margin:0 auto;padding:18px 16px 40px;text-align:center}
h1{font-size:2.1rem;margin:6px 0}h2{font-size:1.25rem;margin:10px 0 16px;line-height:1.4}.mu{color:var(--mu);font-size:.95rem}.hid{display:none!important}
.c{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:20px;margin-top:14px;backdrop-filter:blur(6px)}
input{width:100%;padding:13px;border-radius:12px;border:2px solid var(--bd);background:#0003;color:#fff;font-size:1.05rem;text-align:center;margin:10px 0}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;color:#fff;background:#ffffff26;padding:12px 18px;transition:transform .1s}button:active{transform:scale(.96)}button:disabled{opacity:.4}
.p{background:var(--pr);color:#2b1a00;font-weight:700;font-size:1.1rem;padding:14px 28px;box-shadow:0 4px 0 #b8901a}
.hud{display:flex;justify-content:space-between;align-items:center;font-weight:700;gap:8px}.hud span{background:#0003;border-radius:20px;padding:5px 12px;font-size:.95rem}
.tb{height:12px;background:#0004;border-radius:8px;overflow:hidden;margin:12px 0}.tb i{display:block;height:100%;width:100%;background:var(--ok);transition:width .25s linear,background .3s}
.o{display:block;width:100%;text-align:left;margin:9px 0;padding:14px;font-size:1rem;border:2px solid transparent}.o:hover{border-color:var(--pr)}
.o.g{background:var(--ok);color:#052d1c;animation:pop .4s}.o.b{background:var(--no);animation:shake .4s}.o.x{opacity:.25}
@keyframes pop{50%{transform:scale(1.04)}}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.wd{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:480px){.wd{grid-template-columns:1fr}}
.wc{padding:18px 12px;border-radius:16px;background:var(--card);border:2px solid var(--bd);text-align:center}.wc:hover{border-color:var(--pr)}.wc .e{font-size:2.4rem}.wc b{display:block}
.pu{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}.pu button{font-size:.9rem;padding:9px 14px}
.fb{margin-top:10px;padding:10px;border-radius:12px;background:#0003;font-size:.92rem;text-align:left}
.big{font-size:3.2rem;font-weight:800;color:var(--pr);margin:2px 0}.stars{font-size:2.2rem;letter-spacing:6px}
.fl{position:fixed;left:50%;top:22%;transform:translateX(-50%);font-size:1.6rem;font-weight:800;color:var(--pr);pointer-events:none;animation:up 1s forwards;z-index:5}
@keyframes up{to{opacity:0;transform:translate(-50%,-60px)}}canvas{position:fixed;inset:0;pointer-events:none;z-index:4}
.mb{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:10px;padding:6px 10px;font-size:1rem;z-index:6}
</style></head><body><canvas id="cv"></canvas><button class="mb" id="mt" aria-label="Sound">🔊</button><div class="w">

<div id="s0"><div style="font-size:4rem">🤖</div><h1>AI Quest</h1><p class="mu">Beat 4 worlds of AI, ML, Neural Networks &amp; Deep Learning. Answer fast, build streaks, keep your hearts!</p>
<div class="c"><input id="nm" placeholder="Your player name" maxlength="20"><button class="p" id="go">▶ Play</button>
<p class="mu" style="margin:14px 0 0">❤️ 3 lives per world · ⏱ 15 sec per question · 🔥 3 correct in a row = bonus multiplier</p></div></div>

<div id="s1" class="hid"><h2 id="hi"></h2><div class="wd" id="wd"></div><div class="c"><div class="mu">Total score</div><div class="big" id="ts">0</div><div class="mu" id="rk"></div></div></div>

<div id="s2" class="hid"><div class="hud"><span id="hw"></span><span id="hl"></span><span id="hs"></span></div><div class="tb"><i id="tm"></i></div>
<div class="c"><div class="mu" id="qn"></div><h2 id="qt"></h2><div id="op"></div><div class="fb hid" id="fb"></div>
<div class="pu"><button id="p5">✂️ 50/50 (<b id="c5">1</b>)</button><button id="pk">⏭ Skip (<b id="ck">1</b>)</button><button class="p hid" id="nx" style="padding:10px 22px">Next ➜</button></div></div>
<div class="mu" id="sk" style="margin-top:10px"></div></div>

<div id="s3" class="hid"><div class="c"><div style="font-size:3rem" id="re"></div><h1 id="rt"></h1><div class="stars" id="rs"></div><p id="rd" class="mu"></p><div class="big" id="rp"></div>
<button class="p" id="bk">Back to worlds</button> <button id="rp2">↻ Replay world</button></div></div>
</div>
<script>
const D=[{"t": "AI Basics", "q": "What does AI stand for?", "o": ["Automated Internet", "Artificial Intelligence", "Applied Integration", "Analytical Interface"], "a": 1, "e": "AI means Artificial Intelligence: machines performing tasks that normally need human intelligence."}, {"t": "AI Basics", "q": "Who coined the term “Artificial Intelligence” (1956)?", "o": ["Alan Turing", "John McCarthy", "Geoffrey Hinton", "Elon Musk"], "a": 1, "e": "John McCarthy coined the term at the 1956 Dartmouth Conference."}, {"t": "AI Basics", "q": "Which test checks if a machine can exhibit human-like intelligence in conversation?", "o": ["Turing Test", "Bayes Test", "Pareto Test", "Chi-Square Test"], "a": 0, "e": "The Turing Test, proposed by Alan Turing, evaluates indistinguishability from a human."}, {"t": "AI Basics", "q": "Which is an example of Narrow (Weak) AI?", "o": ["A system that can do any human task", "A chess-playing program", "A conscious robot", "Self-aware software"], "a": 1, "e": "Narrow AI is built for a specific task, such as playing chess."}, {"t": "AI Basics", "q": "Which of the following is NOT a branch of AI?", "o": ["Natural Language Processing", "Computer Vision", "Robotics", "Word Processing"], "a": 3, "e": "Word processing is an application category, not an AI branch."}, {"t": "AI Basics", "q": "A virtual assistant like Siri mainly uses which AI area?", "o": ["Computer Vision", "Natural Language Processing", "Genetic Algorithms", "Game Theory"], "a": 1, "e": "Voice assistants rely on speech recognition and NLP."}, {"t": "AI Basics", "q": "What is an “agent” in AI?", "o": ["Anything that perceives its environment and acts on it", "A human operator", "A database", "A compiler"], "a": 0, "e": "An agent perceives via sensors and acts via actuators."}, {"t": "AI Basics", "q": "Which search algorithm uses a heuristic to guide the search?", "o": ["Breadth-First Search", "Depth-First Search", "A* Search", "Linear Search"], "a": 2, "e": "A* uses f(n)=g(n)+h(n), combining cost so far and a heuristic estimate."}, {"t": "AI Basics", "q": "Which language is most widely used for AI development today?", "o": ["COBOL", "Python", "Fortran", "Assembly"], "a": 1, "e": "Python has a rich ecosystem (NumPy, TensorFlow, PyTorch, scikit-learn)."}, {"t": "AI Basics", "q": "Strong AI (AGI) refers to:", "o": ["AI limited to one task", "AI with human-level general intelligence", "AI that runs only on GPUs", "AI with a strong password"], "a": 1, "e": "AGI can understand and learn any intellectual task a human can."}, {"t": "ML Basics", "q": "Machine Learning is best described as:", "o": ["Explicitly programming every rule", "Systems that learn patterns from data", "Storing data in tables", "Designing hardware chips"], "a": 1, "e": "ML enables computers to learn from data without being explicitly programmed for each rule."}, {"t": "ML Basics", "q": "Which is an example of supervised learning?", "o": ["Clustering customers", "Predicting house prices from labelled data", "Dimensionality reduction", "Anomaly grouping without labels"], "a": 1, "e": "Supervised learning uses labelled input-output pairs."}, {"t": "ML Basics", "q": "K-Means is an example of:", "o": ["Supervised learning", "Unsupervised learning", "Reinforcement learning", "Semi-supervised classification"], "a": 1, "e": "K-Means clusters unlabelled data."}, {"t": "ML Basics", "q": "Which algorithm is used for predicting a continuous value?", "o": ["Logistic Regression", "Linear Regression", "K-Means", "Apriori"], "a": 1, "e": "Linear regression predicts continuous numeric outputs."}, {"t": "ML Basics", "q": "Overfitting means the model:", "o": ["Performs poorly on training and test data", "Performs well on training data but poorly on new data", "Is too simple", "Has no parameters"], "a": 1, "e": "An overfit model memorises noise in the training data and fails to generalise."}, {"t": "ML Basics", "q": "Which technique helps reduce overfitting?", "o": ["Adding more irrelevant features", "Regularization", "Reducing training data", "Training longer with no validation"], "a": 1, "e": "L1/L2 regularization penalises complexity; also dropout, early stopping, more data."}, {"t": "ML Basics", "q": "In reinforcement learning, the agent learns by:", "o": ["Labelled examples", "Rewards and penalties", "Clustering", "Memorising data"], "a": 1, "e": "The agent interacts with an environment and maximises cumulative reward."}, {"t": "ML Basics", "q": "Which metric is best for imbalanced classification?", "o": ["Accuracy only", "F1-score / Precision-Recall", "Mean Squared Error", "R-squared"], "a": 1, "e": "Accuracy can mislead on imbalanced data; F1, precision and recall are more informative."}, {"t": "ML Basics", "q": "Typical train/test split ratio is:", "o": ["10/90", "80/20", "50/150", "0/100"], "a": 1, "e": "80/20 (or 70/30) is a common starting split."}, {"t": "ML Basics", "q": "What is a “feature” in ML?", "o": ["The output label", "An input variable used for prediction", "The loss value", "The learning rate"], "a": 1, "e": "Features are the independent input variables describing each sample."}, {"t": "Neural Networks", "q": "The basic unit of a neural network is called a:", "o": ["Neuron (perceptron)", "Pixel", "Kernel", "Token"], "a": 0, "e": "A neuron computes a weighted sum of inputs plus bias, then applies an activation function."}, {"t": "Neural Networks", "q": "Which layer receives the raw input data?", "o": ["Hidden layer", "Output layer", "Input layer", "Dense layer only"], "a": 2, "e": "The input layer passes raw features into the network."}, {"t": "Neural Networks", "q": "What is the purpose of an activation function?", "o": ["Introduce non-linearity", "Store data", "Reduce dataset size", "Normalize labels"], "a": 0, "e": "Without non-linearity, stacked layers collapse into a single linear transformation."}, {"t": "Neural Networks", "q": "Which activation function outputs values between 0 and 1?", "o": ["ReLU", "Sigmoid", "Tanh", "Linear"], "a": 1, "e": "Sigmoid squashes values into (0,1). Tanh gives (-1,1)."}, {"t": "Neural Networks", "q": "ReLU is defined as:", "o": ["max(0, x)", "1/(1+e^-x)", "x^2", "min(0, x)"], "a": 0, "e": "ReLU returns x if positive, otherwise 0."}, {"t": "Neural Networks", "q": "Weights in a neural network are updated using:", "o": ["Backpropagation with gradient descent", "Random guessing only", "Sorting", "Hashing"], "a": 0, "e": "Backprop computes gradients; gradient descent updates the weights."}, {"t": "Neural Networks", "q": "What does the loss function measure?", "o": ["Network size", "Difference between predicted and actual values", "Training time", "Number of layers"], "a": 1, "e": "Loss quantifies prediction error that training tries to minimise."}, {"t": "Neural Networks", "q": "Learning rate controls:", "o": ["The size of weight update steps", "Number of neurons", "Dataset size", "Number of classes"], "a": 0, "e": "Too high may diverge; too low makes training slow."}, {"t": "Neural Networks", "q": "A single-layer perceptron can solve which problem?", "o": ["XOR", "Linearly separable problems like AND/OR", "Image captioning", "Speech synthesis"], "a": 1, "e": "Single perceptrons can’t solve XOR because it is not linearly separable."}, {"t": "Neural Networks", "q": "Which function is typically used in the output layer for multi-class classification?", "o": ["ReLU", "Softmax", "Step", "Leaky ReLU"], "a": 1, "e": "Softmax converts logits into a probability distribution across classes."}, {"t": "Deep Learning", "q": "Deep Learning is a subset of:", "o": ["Machine Learning", "Databases", "Operating Systems", "Networking"], "a": 0, "e": "Deep Learning uses neural networks with many layers, a subfield of ML."}, {"t": "Deep Learning", "q": "CNNs are mainly used for:", "o": ["Image data", "Only text", "Tabular salary data", "Sorting"], "a": 0, "e": "Convolutional Neural Networks excel at spatial data such as images."}, {"t": "Deep Learning", "q": "RNNs and LSTMs are designed for:", "o": ["Sequential data", "Static images only", "Clustering", "Hardware design"], "a": 0, "e": "They handle sequences such as text, speech and time series."}, {"t": "Deep Learning", "q": "Which architecture introduced “self-attention” and powers modern LLMs?", "o": ["Transformer", "Perceptron", "Autoencoder", "Hopfield net"], "a": 0, "e": "“Attention Is All You Need” (2017) introduced the Transformer."}, {"t": "Deep Learning", "q": "The vanishing gradient problem occurs when:", "o": ["Gradients become extremely small in early layers", "Gradients are exactly 1", "Data is missing", "GPU is unavailable"], "a": 0, "e": "Small gradients stop early layers from learning; ReLU, LSTM, residual connections help."}, {"t": "Deep Learning", "q": "Dropout is used to:", "o": ["Reduce overfitting", "Increase dataset size", "Speed up inference only", "Add more layers"], "a": 0, "e": "Dropout randomly disables neurons during training to improve generalization."}, {"t": "Deep Learning", "q": "Which layer in a CNN reduces spatial dimensions?", "o": ["Pooling layer", "Input layer", "Softmax layer", "Embedding layer"], "a": 0, "e": "Max/average pooling down-samples feature maps."}, {"t": "Deep Learning", "q": "Which are popular deep learning frameworks?", "o": ["TensorFlow and PyTorch", "Excel and Word", "MySQL and Oracle", "Git and Docker"], "a": 0, "e": "TensorFlow, PyTorch and Keras are the most widely used."}, {"t": "Deep Learning", "q": "GANs consist of:", "o": ["A generator and a discriminator", "Two encoders", "A parser and a compiler", "A router and a switch"], "a": 0, "e": "The generator creates fake data; the discriminator tries to tell real from fake."}, {"t": "Deep Learning", "q": "Transfer learning means:", "o": ["Reusing a pre-trained model for a new task", "Copying files between servers", "Training from scratch always", "Deleting layers randomly"], "a": 0, "e": "Fine-tuning pre-trained models saves data and compute."}];const $=i=>document.getElementById(i);
const show=id=>["s0","s1","s2","s3"].forEach(s=>$(s).classList.toggle("hid",s!==id));
const W=[["AI Basics","🧠","Brain Boot Camp"],["ML Basics","📊","Data Dungeon"],["Neural Networks","🕸️","Neuron Jungle"],["Deep Learning","🚀","Deep Space"]];
const sh=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
const best={},stars={};let name="",wi=0,Q=[],qi=0,lives=3,score=0,streak=0,tl=15,tick=null,lock=false,ok=0,p5=1,pk=1,snd=true,ac=null;
const total=()=>Object.values(best).reduce((s,v)=>s+v,0);
function beep(f,d,t="sine"){if(!snd)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.value=.08;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}
const good=()=>{beep(660,.12);setTimeout(()=>beep(880,.18),110)},bad=()=>beep(160,.35,"sawtooth");
$("mt").onclick=()=>{snd=!snd;$("mt").textContent=snd?"🔊":"🔇"};
function title(t){return t>=3500?"🏆 AI Legend":t>=2500?"🥇 ML Master":t>=1500?"🥈 Neural Ninja":t>=500?"🥉 Data Padawan":"🌱 Rookie Bot"}
function worlds(){
  $("hi").textContent="Hi "+name+"! Choose a world";$("ts").textContent=total();$("rk").textContent="Rank: "+title(total());
  $("wd").innerHTML=W.map((w,k)=>`<div class="wc" data-k="${k}" style="cursor:pointer"><div class="e">${w[1]}</div><b>${w[2]}</b><div class="mu">${w[0]}</div><div>${"⭐".repeat(stars[k]||0)||"☆☆☆"}</div><div class="mu">Best: ${best[k]||0}</div></div>`).join("");
  $("wd").querySelectorAll(".wc").forEach(c=>c.onclick=()=>play(+c.dataset.k));show("s1");
}
function play(k){wi=k;Q=sh(D.filter(x=>x.t===W[k][0])).map(x=>{const ix=sh([0,1,2,3]);return{q:x.q,o:ix.map(j=>x.o[j]),a:ix.indexOf(x.a),e:x.e}});
  qi=0;lives=3;score=0;streak=0;ok=0;p5=1;pk=1;show("s2");ask()}
function hud(){$("hw").textContent=W[wi][1]+" "+W[wi][2];$("hl").textContent="❤️".repeat(lives)||"💔";$("hs").textContent="⭐ "+score;$("c5").textContent=p5;$("ck").textContent=pk;
  $("sk").textContent=streak>=3?"🔥 Streak x"+streak+"  ·  multiplier ×"+mult():streak?"Streak "+streak:""}
const mult=()=>Math.min(3,1+Math.floor(streak/3)*.5);
function ask(){
  lock=false;const q=Q[qi];tl=15;$("qn").textContent=`Question ${qi+1} of ${Q.length}`;$("qt").textContent=q.q;$("fb").classList.add("hid");$("nx").classList.add("hid");
  $("op").innerHTML=q.o.map((o,j)=>`<button class="o" data-j="${j}"><b>${"ABCD"[j]}.</b> ${o}</button>`).join("");
  $("op").querySelectorAll(".o").forEach(b=>b.onclick=()=>pick(+b.dataset.j));$("p5").disabled=!p5;$("pk").disabled=!pk;hud();
  clearInterval(tick);tick=setInterval(()=>{tl-=.25;$("tm").style.width=tl/15*100+"%";$("tm").style.background=tl<5?"var(--no)":"var(--ok)";if(tl<=0){clearInterval(tick);pick(-1)}},250);$("tm").style.width="100%";
}
function fly(t){const d=document.createElement("div");d.className="fl";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1000)}
function pick(j){
  if(lock)return;lock=true;clearInterval(tick);const q=Q[qi],bs=$("op").querySelectorAll(".o");
  bs.forEach((b,k)=>{if(k===q.a)b.classList.add("g");else if(k===j)b.classList.add("b");else b.classList.add("x")});
  if(j===q.a){streak++;ok++;const g=Math.round((100+Math.ceil(tl)*5)*mult());score+=g;fly("+"+g);good();$("fb").textContent="✅ Correct! "+q.e}
  else{streak=0;lives--;bad();$("fb").textContent=(j<0?"⏰ Time’s up! ":"❌ Not quite. ")+q.e}
  $("fb").classList.remove("hid");$("p5").disabled=$("pk").disabled=true;hud();$("nx").classList.remove("hid");$("nx").textContent=(lives<=0||qi===Q.length-1)?"See result ➜":"Next ➜"}
$("nx").onclick=()=>{if(lives<=0||qi===Q.length-1)end();else{qi++;ask()}};
$("p5").onclick=()=>{if(lock||!p5)return;p5=0;const q=Q[qi];const w=sh([0,1,2,3].filter(k=>k!==q.a)).slice(0,2);$("op").querySelectorAll(".o").forEach((b,k)=>{if(w.includes(k)){b.classList.add("x");b.disabled=true}});$("p5").disabled=true;hud()};
$("pk").onclick=()=>{if(lock||!pk)return;pk=0;clearInterval(tick);if(qi===Q.length-1){end();return}qi++;ask()};
function end(){
  clearInterval(tick);const win=lives>0,acc=ok/Q.length,st=!win?0:acc>=.9?3:acc>=.7?2:1;
  if(score>(best[wi]||0))best[wi]=score;if(st>(stars[wi]||0))stars[wi]=st;
  $("re").textContent=win?(st===3?"🏆":"🎉"):"💀";$("rt").textContent=win?"World cleared!":"Game over";$("rs").textContent=win?"⭐".repeat(st)+"☆".repeat(3-st):"☆☆☆";
  $("rd").textContent=`${ok} of ${Q.length} correct · ${lives} ❤️ left`+(win?"":" · Don’t give up, try again!");$("rp").textContent=score+" pts";show("s3");
  if(st===3)confetti();else if(win)confetti(40)}
$("bk").onclick=worlds;$("rp2").onclick=()=>play(wi);
$("go").onclick=()=>{name=$("nm").value.trim();if(!name){$("nm").focus();return}beep(520,.1);worlds()};
$("nm").addEventListener("keydown",e=>{if(e.key==="Enter")$("go").click()});
const cv=$("cv"),cx=cv.getContext("2d");let ps=[];
function confetti(n=140){cv.width=innerWidth;cv.height=innerHeight;for(let k=0;k<n;k++)ps.push({x:Math.random()*cv.width,y:-20-Math.random()*200,vx:Math.random()*4-2,vy:2+Math.random()*4,c:`hsl(${Math.random()*360},90%,60%)`,s:5+Math.random()*6});if(ps.length===n)anim()}
function anim(){cx.clearRect(0,0,cv.width,cv.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;cx.fillStyle=p.c;cx.fillRect(p.x,p.y,p.s,p.s)});ps=ps.filter(p=>p.y<cv.height+20);if(ps.length)requestAnimationFrame(anim)}
</script></body></html>
